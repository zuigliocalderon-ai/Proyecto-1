services:
  - type: web
    name: sports-predictions-api
    env: python
    plan: free
    buildCommand: pip install -r requirements-simple.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ODDS_API_KEY
        value: 9e76e9a371972c3f41c03820ba1879db
